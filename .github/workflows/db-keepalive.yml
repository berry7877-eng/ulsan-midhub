# Supabase 자동정지 방지 — 2026-07-28
#
# 배경: 무료 플랜은 7일간 DB 활동이 없으면 프로젝트가 자동 정지된다.
#       실제로 2026-07-17에 정지돼 사이트 DB가 죽었고 7/27에 수동 재개했다.
#
# 왜 여기(GitHub Actions)에서 도는가:
#   일일 콘텐츠 발행 루틴(클라우드 에이전트)에 핑을 넣어봤지만, 그 실행 환경은
#   외부 도메인 접속을 프록시에서 차단한다(vercel.app → 403). github.com 만 열려 있다.
#   GitHub Actions 러너는 외부 인터넷이 열려 있어서 여기서 도는 게 맞다.
#
# 어떻게 DB를 깨우는가 (인증키 불필요):
#   /jobs/board 는 서버 컴포넌트 + force-dynamic 이라, 요청이 올 때마다
#   Vercel 서버가 Supabase 의 job_posts 테이블을 조회한다. 즉 페이지 한 번 부르면
#   실제 DB 쿼리가 발생한다. anon key 조차 필요 없다.

name: DB keepalive

on:
  schedule:
    # 매일 03:23 UTC = 12:23 KST. 정시(:00)는 GitHub 크론이 몰려 지연되므로 피함.
    # 콘텐츠 발행(07:30 KST)과 시간대를 벌려 독립적인 안전망이 되게 함.
    - cron: "23 3 * * *"
  workflow_dispatch:        # 필요할 때 수동 실행

# 동시 실행 방지 — 밀린 스케줄이 겹쳐 돌지 않게
concurrency:
  group: db-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 게시판 호출 (서버측 Supabase 조회 유발)
        run: |
          URL="https://ulsan-midhub.vercel.app/jobs/board"
          echo "핑 대상: $URL"

          # 일시적 네트워크 문제로 오탐하지 않게 최대 3회 재시도
          for i in 1 2 3; do
            CODE=$(curl -sS -o /tmp/board.html -w "%{http_code}" \
                     --max-time 45 --retry 0 "$URL" || echo "000")
            echo "시도 $i → HTTP $CODE"
            [ "$CODE" = "200" ] && break
            [ "$i" -lt 3 ] && sleep 20
          done

          if [ "$CODE" != "200" ]; then
            echo "::error::사이트 응답 실패 (HTTP $CODE) — Vercel 배포 또는 Supabase 상태 확인 필요"
            exit 1
          fi

          # 200 이어도 DB 가 죽어 있으면 폴백 UI 가 뜬다.
          # 정상 상태: 글이 있으면 목록, 없으면 '아직 등록된 이웃 글이 없어요'.
          # 둘 다 DB 조회가 성공했다는 뜻이다.
          if grep -q "이웃 구인·구직" /tmp/board.html; then
            echo "✅ DB 조회 정상 — Supabase 활동 기록됨 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          else
            echo "::error::페이지는 200 인데 게시판 내용이 없음 — DB 연결 이상 의심"
            head -c 400 /tmp/board.html
            exit 1
          fi
